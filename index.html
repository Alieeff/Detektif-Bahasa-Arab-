<title>مُحَقِّقُ اللُّغَة – Detektif Bahasa Arab</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111a24;--desk:#1c2c3f;--paper:#f1ecdf;--paper2:#e2dac4;--text:#1b1b1b;--amber:#e8b04a;--red:#d8452c;--green:#3f9a6f;--mute:#9fb0c2}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#24384f,var(--ink) 60%);color:#e9eef4;font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px 16px 70px}
.ar{font-family:'Amiri',serif;direction:rtl;line-height:1.9}
h1{margin:4px 0 0;font-size:clamp(2.4rem,10vw,4rem);color:var(--amber);font-weight:700;line-height:1.3;text-shadow:0 0 24px #e8b04a44}
h2{font-size:1.1rem;margin:24px 0 8px;font-weight:800}
.sub{margin:0 0 14px;color:var(--mute)}
.hud{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0c131bee;backdrop-filter:blur(6px);padding:10px 14px;border-radius:8px;margin:8px 0;border:1px solid #2d445e;font-weight:800}
.hud .h{font-size:1.2rem;letter-spacing:2px}
.hud.hit{animation:hit .5s}
@keyframes hit{0%,100%{background:#0c131bee}30%{background:#7a1f12}}
.story{background:var(--desk);border-left:4px solid var(--red);padding:14px 16px;border-radius:4px}
.bar{height:8px;background:var(--desk);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .4s}
.hint{color:var(--mute);font-size:.92rem}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.clue{background:var(--paper);color:var(--text);border:0;border-radius:4px;padding:12px;text-align:left;box-shadow:0 3px 0 #0007;position:relative;transform:rotate(-.6deg)}
.clue:nth-child(even){transform:rotate(.6deg)}
.clue b{display:block}.clue small{color:#5a5a5a}
.clue.done{background:var(--paper2)}
.clue.done::after{content:"TERBUKTI";position:absolute;right:6px;top:8px;color:var(--green);border:2px solid var(--green);font-size:.6rem;font-weight:800;padding:0 4px;transform:rotate(8deg)}
.clue.open{outline:3px solid var(--amber)}
.clue:disabled{background:#37485c;color:#8ea0b4;cursor:not-allowed;box-shadow:none}
.clue:disabled small{color:#8ea0b4}
.panel{background:var(--paper);color:var(--text);border-radius:6px;padding:18px;margin-top:14px;box-shadow:0 6px 0 #0007}
.tbar{height:10px;background:#cfc8b4;border-radius:6px;overflow:hidden;margin:8px 0}
.tbar i{display:block;height:100%;width:100%;background:var(--green)}
.tbar.low i{background:var(--red)}
.say{font-size:1.9rem;background:var(--paper2);padding:8px 14px;border-radius:4px;margin:10px 0}
.say.h2{font-family:inherit;direction:ltr;font-size:1rem;color:#555}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mini{background:transparent;border:2px solid var(--text);color:var(--text);border-radius:20px;padding:6px 14px;font-weight:600}
.mini:disabled{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cfc8b4;border-radius:6px;padding:10px 12px;margin:6px 0;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--text)}
.opt.ok{background:#d5eadd;border-color:var(--green)}
.opt.no{background:#f4d6cf;border-color:var(--red);text-decoration:line-through}
.note{margin-top:10px;padding:10px 12px;background:#fff6dc;border-left:4px solid var(--amber);border-radius:3px}
.tr{font-style:italic;color:#444}
.sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.s{background:var(--desk);border:2px solid #2d445e;border-radius:8px;padding:12px;text-align:center;color:#e9eef4}
.s .em{font-size:2rem;display:block}.s .ar{font-size:1.7rem;display:block}
.s.clear{opacity:.55}.s.clear .ar{text-decoration:line-through}
.s.warn{border-color:var(--red)}
.s:not(:disabled):hover{border-color:var(--amber)}
.s:disabled{cursor:not-allowed}
.tag{display:block;font-size:.8rem;color:var(--mute)}
.end{background:var(--paper);color:var(--text);border-radius:8px;padding:20px;margin-top:16px}
.end h3{margin:0 0 8px;font-size:1.3rem}
.go{background:var(--amber);border:0;border-radius:6px;padding:10px 18px;font-weight:800;color:#222;margin-top:8px}
.modal{position:fixed;inset:0;z-index:30;background:#000000cc;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .3s}
.box{width:100%;max-width:520px;min-height:75vh;background:var(--paper);color:var(--text);border-radius:12px;border:4px solid var(--red);padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 60px #d8452c66;animation:pop .35s}
.box.win{border-color:var(--green);box-shadow:0 0 60px #3f9a6f66}
.box h3{font-size:2.4rem;margin:4px 0;color:var(--red);line-height:1.1}
.box.win h3{color:var(--green)}
.box .go{font-size:1.1rem;padding:12px 28px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake,.hud.hit,.modal,.box{animation:none}.bar i{transition:none}}
</style>
</head>

 {t:'Guru lab',type:'baca',req:[5],ar:'قَالَتِ الْمُعَلِّمَةُ: بَدَأَتْ حِصَّةُ الْمُخْتَبَرِ فِي الْعَاشِرَةِ وَانْتَهَتْ فِي الْحَادِيَةَ عَشْرَةَ، وَكَانَتْ لَيْلَى حَاضِرَةً.',tr:'Guru berkata: Pelajaran lab mulai jam sepuluh dan selesai jam sebelas, dan Layla hadir.',q:'Apakah alibi Layla cocok dengan waktu kejadian?',o:['Ya, pelajaran lab berlangsung jam 10 sampai 11','Tidak, pelajaran selesai jam 9','Tidak, Layla terlambat satu jam'],a:0,note:'Layla punya alibi penuh.',fx:[{k:'layla',tag:'Alibi: pelajaran lab',clear:1}]},
 {t:'Kunci lemari',type:'baca',req:[0],ar:'كَانَ الْمِفْتَاحُ مَعَ إِبْرَاهِيمَ، لَكِنَّهُ كَانَ فِي الْمَلْعَبِ مَعَ الْفَرِيقِ حَتَّى الْحَادِيَةَ عَشْرَةَ.',tr:'Kunci ada pada Ibrahim, tetapi ia di lapangan bersama tim sampai jam sebelas.',q:'Mengapa Ibrahim tidak bisa jadi pelaku meski memegang kunci?',o:['Ia sakit','Ia di lapangan bersama tim sampai jam 11','Ia sedang di rumah','Kuncinya rusak'],a:1,note:'Memegang kunci tidak cukup. Ibrahim punya alibi.',fx:[{k:'ibrahim',tag:'Alibi: lapangan',clear:1}]}
 ]}
];
let lvi,lives,score,streak,solved,open,tleft,timer,showTxt,showTr,over,failed,left,plays,keyMode,keyFail,T;
const $=id=>document.getElementById(id);
const L=()=>LV[lvi];

function newGame(){lives=3;score=0;lvi=0;load()}
function load(){
  const l=L();T=l.T;streak=0;solved=new Set();open=null;showTxt=false;showTr=false;over=false;failed=new Set();left={};plays={};keyMode=false;keyFail=new Set();
  clearInterval(timer);$('panel').innerHTML='';$('end').innerHTML='';
  $('title').textContent='Level '+(lvi+1)+' dari 3: '+l.title;$('story').textContent=l.story;
  render();window.scrollTo(0,0)}
function speak(t){
  if(!('speechSynthesis' in window)){alert('Browser ini tidak mendukung suara. Coba Chrome atau Safari.');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u)}
function play(){
  const l=L(),c=l.clues[open];
  if(c.type==='dengar'&&!solved.has(open)){if((plays[open]||0)>=l.plays)return;plays[open]=(plays[open]||0)+1}
  speak(c.ar);drawPanel()}
function locked(i){return (L().clues[i].req||[]).some(r=>!solved.has(r))}
function render(){
  const l=L(),n=solved.size,tot=l.clues.length;
  $('hud').innerHTML=`<span class="h" aria-label="${lives} nyawa">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><span>Level ${lvi+1}/3</span><span>Skor ${score}</span><span>Streak ${streak}🔥</span>`;
  $('fill').style.width=(n/tot*100)+'%';
  $('count').textContent=n+' dari '+tot+' petunjuk terbukti';
  $('clues').innerHTML=l.clues.map((c,i)=>{
    const lk=locked(i);
    return `<button class="clue ${solved.has(i)?'done':''} ${open===i?'open':''}" ${over||lk?'disabled':''} onclick="openClue(${i})"><b>${lk?'🔒 Terkunci':c.t}</b><small>${lk?'Buktikan petunjuk lain dulu':c.type==='baca'?'📄 Baca teks':'🎧 Dengarkan'}</small></button>`}).join('');
  const fx=[];[...solved].sort((a,b)=>a-b).forEach(i=>(l.clues[i].fx||[]).forEach(f=>fx.push(f)));
  const all=n===tot&&!over&&!keyMode;
  $('sus').innerHTML=l.sus.map(s=>{
    const m=fx.filter(f=>f.k===s.k),c=m.some(f=>f.clear),w=!c&&m.some(f=>f.warn);
    return `<button class="s ${c?'clear':''} ${w?'warn':''}" ${all?'':'disabled'} onclick="accuse('${s.k}')"><span class="em">${s.em}</span><span class="ar" lang="ar">${s.ar}</span>${s.n}${m.map(f=>`<span class="tag">${f.tag}</span>`).join('')}</button>`}).join('');
  $('accHint').textContent=over?'':keyMode?'':all?'Semua bukti terkumpul. Salah tuduh mengurangi nyawa.':'Buktikan semua petunjuk untuk membuka tuduhan.'}
function openClue(i){
  if(over||open===i||locked(i))return;
  if(open!==null&&!solved.has(open))left[open]=tleft;
  open=i;showTxt=false;showTr=false;clearInterval(timer);
  tleft=left[i]!==undefined?left[i]:T;
  if(!solved.has(i))timer=setInterval(tick,100);
  drawPanel()}
function tick(){
  tleft-=.1;left[open]=tleft;const b=$('tb');
  if(b){b.firstElementChild.style.width=Math.max(0,tleft/T*100)+'%';b.classList.toggle('low',tleft<T/3)}
  if(tleft<=0){tleft=T;streak=0;loseLife('Waktu habis!')}}
function loseLife(msg){
  lives--;const h=$('hud');render();h.classList.remove('hit');void h.offsetWidth;h.classList.add('hit');
  if(lives<=0){gameOver();return}
  if(open!==null&&!solved.has(open))drawPanel(msg)}
function drawPanel(msg){
  render();
  if(open===null){$('panel').innerHTML='';return}
  const l=L(),c=l.clues[open],ok=solved.has(open),hide=c.type==='dengar'&&!ok&&!showTxt;
  const rem=l.plays-(plays[open]||0),lim=c.type==='dengar'&&!ok;
  $('panel').innerHTML=`<div class="panel"><b>${c.t}</b>
  ${ok?'':'<div class="tbar" id="tb"><i></i></div>'}
  ${hide?`<div class="say h2">Teks disembunyikan. Tekan Dengarkan dan simak baik-baik.</div>`:`<div class="say ar" lang="ar">${c.ar}</div>`}
  <div class="row"><button class="mini" ${lim&&rem<=0?'disabled':''} onclick="play()">🔊 Dengarkan${lim?' ('+rem+' tersisa)':''}</button>
  ${hide?`<button class="mini" onclick="showTxt=true;score=Math.max(0,score-50);drawPanel()">Buka teks (-50)</button>`:''}
  ${!ok&&!showTr?`<button class="mini" onclick="showTr=true;score=Math.max(0,score-30);drawPanel()">Terjemahan (-30)</button>`:''}</div>
  ${(showTr||ok)?`<p class="tr">${c.tr}</p>`:''}
  ${msg?`<p class="note" style="border-color:var(--red);background:#fde3dd"><b>${msg}</b> Nyawa berkurang.</p>`:''}
  <p><b>${c.q}</b></p>
  ${c.o.map((o,j)=>{const f=failed.has(open+'-'+j);return `<button class="opt ${ok&&j===c.a?'ok':''} ${f?'no':''}" ${ok||f?'disabled':''} onclick="answer(${j})">${o}</button>`}).join('')}
  ${ok?`<div class="note"><b>Catatan detektif:</b> ${c.note}</div>`:''}</div>`}
function answer(j){
  const c=L().clues[open];
  if(j===c.a){
    clearInterval(timer);
    score+=Math.round((100+tleft*4)*(1+Math.min(streak,3)*.25))+lvi*30;
    streak++;solved.add(open);drawPanel();
  }else{failed.add(open+'-'+j);streak=0;loseLife('Jawaban salah!')}}
function modal(cls,html){$('end').innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><div class="box ${cls}">${html}</div></div>`;const b=$('mbtn');if(b)b.focus()}
function gameOver(){
  clearInterval(timer);over=true;render();$('panel').innerHTML='';
  modal('',`<div style="font-size:4rem">💔</div><h3>Anda Kalah!</h3>
  <p class="ar" lang="ar" style="font-size:2rem;margin:0;color:var(--red)">خَسِرْتَ الْقَضِيَّةَ</p>
  <p>Nyawamu habis di Level ${lvi+1} dan pelaku berhasil lolos.</p><p><b>Skor akhir: ${score}</b></p>
  <button class="go" id="mbtn" onclick="newGame()">Mulai dari Level 1</button>`)}
function accuse(k){
  const l=L();
  if(k===l.culprit){keyMode=true;render();keyCard()}
  else{const s=l.sus.find(x=>x.k===k);streak=0;loseLife('Salah tuduh!');
    if(!over)$('end').innerHTML=`<div class="end"><h3>${s.n} bukan pelakunya.</h3><p>Cek ulang siapa yang punya alibi dan siapa yang berbohong.</p></div>`}}
function keyCard(){
  const q=L().key;
  $('end').innerHTML=`<div class="end"><h3>Tuduhanmu diterima hakim. Apa alasanmu?</h3><p><b>${q.q}</b></p>
  ${q.o.map((o,j)=>{const f=keyFail.has(j);return `<button class="opt ${f?'no':''}" ${f?'disabled':''} onclick="keyAns(${j})">${o}</button>`}).join('')}</div>`;
  $('end').scrollIntoView({behavior:'smooth',block:'center'})}
function keyAns(j){
  if(j===L().key.a){levelClear();return}
  keyFail.add(j);streak=0;loseLife('Alasan salah!');if(!over)keyCard()}
function levelClear(){
  const bonus=lives*200;score+=bonus;render();
  if(lvi<2){
    modal('win',`<div style="font-size:4rem">🕵️</div><h3>Level ${lvi+1} selesai!</h3>
    <p class="ar" lang="ar" style="font-size:1.8rem;margin:0">أَحْسَنْتَ!</p>
    <p>Bonus nyawa +${bonus}. Skor: ${score}.<br>Kamu mendapat 1 nyawa tambahan (maksimal 3).</p>
    <button class="go" id="mbtn" onclick="lvi++;lives=Math.min(3,lives+1);load()">Lanjut ke Level ${lvi+2}</button>`)
  }else{
    const rank=lives===3?'Detektif Legendaris 🏆':lives===2?'Detektif Senior 🥈':'Detektif Muda 🥉';
    modal('win',`<div style="font-size:4rem">🏆</div><h3>Semua kasus terpecahkan!</h3>
    <p class="ar" lang="ar" style="font-size:1.8rem;margin:0">مُحَقِّقٌ عَظِيمٌ!</p>
    <p><b>Peringkat: ${rank}</b><br>Skor akhir: ${score}</p>
    <button class="go" id="mbtn" onclick="newGame()">Main lagi</button>`)}}
newGame();
</script>
</body>
</html>
